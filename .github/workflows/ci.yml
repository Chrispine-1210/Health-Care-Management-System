name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit
      - name: Type check
        run: npm run check
      - name: Automated tests
        run: npm test
      - name: Validate migrations
        run: npm run migration:check
      - name: Validate route-security register
        run: npm run route-security:check
      - name: Production build
        run: npm run build
      - name: Verify generated evidence is current
        run: git diff --exit-code
      - name: Verify patch hygiene
        run: git diff --check
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: thandizo-build-${{ github.sha }}
          path: |
            dist/
            api/vercel-handler.js
          if-no-files-found: error
          retention-days: 7

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Block critical development dependency vulnerabilities
        run: npm audit --audit-level=critical
