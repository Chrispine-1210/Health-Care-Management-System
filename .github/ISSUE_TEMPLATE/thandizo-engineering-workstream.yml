name: Engineering work item
description: Plan a security, patient-safety, inventory, platform or operational change.
title: "[Work] "
labels: [triage]
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 - Critical or immediate risk
        - P1 - High impact
        - P2 - Material improvement
        - P3 - Enhancement or future scale
    validations:
      required: true
  - type: dropdown
    id: workstream
    attributes:
      label: Workstream
      options:
        - Security and identity
        - Patient and clinical workflows
        - Inventory and dispensing
        - Orders, payments and delivery
        - Data, migrations and audit
        - Platform, reliability and observability
        - User experience and accessibility
        - Compliance and operational readiness
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: Describe the concrete operational, security, patient-safety, data-integrity or performance gap.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact analysis
      description: Cover patient, pharmacy, system, inventory, privacy and financial impact.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: Define what will change and what is deliberately excluded.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Use measurable, testable criteria.
    validations:
      required: true
  - type: textarea
    id: safety_security
    attributes:
      label: Safety, security and data analysis
      description: Cover authorization, patient data, stock/dispensing, payments, audit evidence and regulatory implications.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Test and validation plan
      description: Include positive, denied, failure/rollback, migration and staging evidence as applicable.
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: Rollback and monitoring plan
      description: Define recovery actions, irreversible data risks and production acceptance signals.
    validations:
      required: true
  - type: input
    id: dependencies
    attributes:
      label: Dependencies
      placeholder: Related issues, providers, migrations, APIs or infrastructure.
    validations:
      required: true
  - type: dropdown
    id: effort
    attributes:
      label: Estimated effort
      options:
        - S - 0.5 to 1 day
        - M - 2 to 3 days
        - L - 4 to 7 days
        - XL - 2 or more weeks
    validations:
      required: true

